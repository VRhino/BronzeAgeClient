<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de la plaza 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e17; color: #e8e2d0; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      #escena { position: absolute; inset: 0; }
      #mandos { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; max-width: calc(100% - 300px); background: rgba(10, 14, 23, 0.82); padding: 8px 10px; border-radius: 6px; }
      #mandos select, #mandos button, #mandos label { font: inherit; color: inherit; }
      #mandos select, #mandos button { background: #1d2433; border: 1px solid #3a4558; border-radius: 4px; padding: 2px 6px; }
      #mandos button { cursor: pointer; }
      #lectura { position: absolute; bottom: 10px; left: 10px; background: rgba(10, 14, 23, 0.82); padding: 6px 10px; border-radius: 6px; font: 12px ui-monospace, monospace; white-space: pre; }
      #mini { position: absolute; right: 12px; bottom: 12px; width: 240px; height: 240px; border: 2px solid rgba(244, 234, 210, 0.45); border-radius: 6px; overflow: hidden; background: #2a2a22; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
      #mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #mini .asent-minimapa-camara, #mini-camp .asent-minimapa-camara { pointer-events: none; }
      #mini-camp { position: absolute; right: 12px; bottom: 12px; width: 240px; height: 240px; border: 2px solid rgba(244, 234, 210, 0.45); border-radius: 6px; overflow: hidden; background: #93c26b; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
      #mini-camp[hidden] { display: none; }
      #mini-camp svg, #mini-camp canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #ficha { position: absolute; right: 12px; top: 12px; width: 260px; background: rgba(10, 14, 23, 0.85); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="escena"></div>
    <div id="mandos">
      <strong>Banco de la plaza 3D</strong>
      <label>Plaza <select id="ciudad"><option value="aldea">Aldea (nivel 1)</option><option value="pueblo">Pueblo amurallado (nivel 3)</option><option value="ciudad" selected>Ciudad (nivel 5)</option><option value="campamento-0">Campamento de mercenarios 1</option><option value="campamento-1">Campamento de mercenarios 2</option><option value="campamento-2">Campamento de mercenarios 3</option></select></label>
      <label>Estilo <select id="nivel"><option value="">el suyo</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Muralla <select id="muralla"><option value="">la suya</option><option>1</option><option>2</option><option>3</option></select></label>
      <label>Obras <input id="obras" type="range" min="0" max="100" value="50"></label>
      <label><input type="checkbox" id="ajena"> Plaza ajena</label>
      <label><input type="checkbox" id="saqueo"> Saqueada</label>
      <label><input type="checkbox" id="ascenso"> Subiendo de nivel</label>
    </div>
    <div id="ficha">Clic en un edificio.</div>
    <div id="mini"><canvas id="mapa" width="720" height="720"></canvas></div>
    <div id="mini-camp" hidden><svg id="plano" viewBox="0 0 1 1"></svg></div>
    <div id="lectura">cargando…</div>
    <script type="module" src="./banco.ts"></script>
  </body>
</html>
