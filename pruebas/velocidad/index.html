<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de la velocidad de la columna</title>
    <style>
      body { background: #0b0805; padding: 14px; }
      #mandos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; color: #e8e2d0; font: 13px system-ui; align-items: center; }
      #mandos button { background: #1d2433; color: inherit; border: 1px solid #3a4558; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      #lienzo { max-width: 1100px; }
      .banco-barras { display: flex; flex-direction: column; gap: 10px; }
      .banco-barras .mapa-comida { position: static; transform: none; }
      .banco-barras p { color: #9ca3af; font: 12px system-ui; margin: 0; }
    </style>
  </head>
  <body>
    <div id="mandos"><strong>Banco de la velocidad de la columna</strong>
      <button type="button" data-ver="salida">Salir de la plaza</button>
      <button type="button" data-ver="convocatoria">Ejército en preparación</button>
      <button type="button" data-ver="barra">Barra de víveres</button>
      <button type="button" data-ver="fundar">Fundar: sin parcelas</button>
    </div>
    <div id="lienzo"></div>
    <script type="module" src="./banco.ts"></script>
  </body>
</html>
