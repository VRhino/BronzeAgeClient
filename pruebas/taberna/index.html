      .banco-marco { background: var(--marco-bg); border: 1px solid var(--bronce-osc); border-radius: 10px; padding: 12px; width: 960px; box-sizing: border-box; }
      .banco-marco.estrecho { width: 620px; }
    </style>

    <div id="mandos"><strong>Banco de la taberna regional</strong>
