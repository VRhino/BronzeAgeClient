<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de Centro urbano</title>
    <style>
      body { background: #0b0805; margin: 0; padding: 14px; }
      #mandos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; color: #e8e2d0; font: 13px system-ui; align-items: center; }
      #mandos button { background: #1d2433; color: inherit; border: 1px solid #3a4558; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      #mandos button.activo { border-color: #c8aa6e; }
      #lienzo.asent-lado { width: 440px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="mandos"><strong>Banco de Centro urbano</strong>
      <button type="button" data-escena="gobernador">Gobernador y Rey</button>
      <button type="button" data-escena="visita">De visita</button>
      <button type="button" data-escena="obra">Subiendo de nivel</button>
      ·
      <button type="button" data-sub="resumen">Resumen</button>
      <button type="button" data-sub="cargos">Cargos</button>
      <button type="button" data-sub="reclutamiento">Reclutamiento</button>
      <button type="button" data-sub="taberna">Taberna</button>
      <button type="button" data-sub="ordenes">Órdenes</button>
      <button type="button" data-sub="caravanas">Caravanas</button>
      <button type="button" data-sub="trueques">Trueques</button>
      <button type="button" data-sub="muralla">Muralla</button>
      <button type="button" data-sub="puerta">Puerta</button>
      <button type="button" data-sub="tesoreria">Tesorería</button>
      <button type="button" data-sub="fundacion">Fundación</button>
    </div>
    <aside id="lienzo" class="asent-lado"><div class="asent-edificios"><div class="asent-edif-cuerpo"></div></div></aside>
    <script type="module" src="./banco.ts"></script>
  </body>
</html>
